<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Callio Voice</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #181b22;
            --border: #2a2f3a;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --user: #1a73e8;
            --bot: #2d333b;
            --accent: #34a853;
            --warn: #f9ab00;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        .app-title { font-weight: 600; font-size: 1rem; }
        .status-pill {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }
        .status-pill.connected { color: var(--accent); border-color: #2e7d52; }
        .status-pill.connecting { color: var(--warn); }
        .status-pill.disconnected { color: #ea4335; }
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            min-height: 0;
        }
        @media (min-width: 900px) {
            .main { grid-template-columns: 1fr 280px; }
        }
        .chat-column {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bubble {
            max-width: min(85%, 640px);
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.45;
            font-size: 15px;
            word-break: break-word;
        }
        .bubble.user {
            align-self: flex-end;
            background: var(--user);
            border-bottom-right-radius: 4px;
        }
        .bubble.bot {
            align-self: flex-start;
            background: var(--bot);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .bubble.interim {
            opacity: 0.65;
            border: 1px dashed var(--border);
            background: transparent;
        }
        .bubble .role {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .latency-bar {
            font-size: 12px;
            color: var(--muted);
            padding: 6px 16px;
            border-top: 1px solid var(--border);
            min-height: 30px;
        }
        .composer {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }
        .composer select {
            flex: 1;
            max-width: 200px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        #startBtn { background: var(--accent); color: #fff; }
        #stopBtn { background: #c5221f; color: #fff; }
        .side-panel {
            border-left: 1px solid var(--border);
            background: var(--panel);
            display: none;
            flex-direction: column;
            min-height: 0;
        }
        @media (min-width: 900px) { .side-panel { display: flex; } }
        .side-panel h3 {
            margin: 0;
            padding: 12px 14px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }
        .tasks {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
        }
        .task-item {
            font-size: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .task-proposed { color: var(--warn); }
        .task-running { color: #8ab4f8; }
        .task-success { color: var(--accent); }
        .task-actions button { font-size: 11px; padding: 4px 8px; margin-right: 6px; }
        .hint {
            font-size: 12px;
            color: var(--muted);
            padding: 8px 16px 12px;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-title">Callio Voice</div>
        <div id="status" class="status-pill disconnected">Disconnected</div>
    </header>
    <main class="main">
        <div class="chat-column">
            <div id="messages" class="messages" aria-live="polite"></div>
            <div id="latencyBar" class="latency-bar">Latency: —</div>
            <footer class="composer">
                <select id="sessionSelect" title="Session">
                    <option value="">New session</option>
                </select>
                <button id="startBtn" type="button">Start call</button>
                <button id="stopBtn" type="button" disabled>End</button>
            </footer>
            <div class="hint">Full-duplex voice chat · streaming STT · ONNX Smart Turn EOU</div>
        </div>
        <aside class="side-panel">
            <h3>Background tasks <button id="confirmAllBtn" type="button" style="font-size:11px;padding:4px 8px;">Confirm all</button></h3>
            <div id="tasks" class="tasks"></div>
        </aside>
    </main>

    <script>
        const TARGET_SAMPLE_RATE = 16000;
        let ws = null, statusWs = null, sessionId = null;
        let audioContext = null, mediaStream = null, audioProcessor = null;
        let isRecording = false, playbackNextTime = 0;
        let interimEl = null;

        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const tasksEl = document.getElementById('tasks');
        const latencyBar = document.getElementById('latencyBar');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sessionSelect = document.getElementById('sessionSelect');
        document.getElementById('confirmAllBtn').onclick = () => confirmAllTasks();
        startBtn.onclick = () => startSession();
        stopBtn.onclick = () => stopSession();

        function formatSessionLabel(session) {
            const title = session.title || session.session_id.slice(0, 8);
            return `${title} · ${session.ended_at ? 'ended' : 'active'}`;
        }

        async function loadSessionOptions() {
            try {
                const res = await fetch('/api/v1/sessions');
                const data = await res.json();
                const current = sessionSelect.value;
                sessionSelect.innerHTML = '<option value="">New session</option>';
                (data.items || []).forEach((s) => {
                    const opt = document.createElement('option');
                    opt.value = s.session_id;
                    opt.textContent = formatSessionLabel(s);
                    sessionSelect.appendChild(opt);
                });
                if (current) sessionSelect.value = current;
            } catch (e) { console.warn(e); }
        }
        loadSessionOptions();

        function updateStatus(status, text) {
            statusEl.className = 'status-pill ' + status;
            statusEl.textContent = text;
        }

        function addMessage(role, text, { interim = false } = {}) {
            if (interim) {
                if (!interimEl) {
                    interimEl = document.createElement('div');
                    interimEl.className = 'bubble user interim';
                    messagesEl.appendChild(interimEl);
                }
                interimEl.innerHTML = `<span class="role">You · listening</span>${text}`;
                messagesEl.scrollTop = messagesEl.scrollHeight;
                return;
            }
            if (interimEl) {
                interimEl.remove();
                interimEl = null;
            }
            const div = document.createElement('div');
            div.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
            const label = role === 'user' ? 'You' : 'Callio';
            div.innerHTML = `<span class="role">${label}</span>${text}`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showLatency(data) {
            const d = data.derived_ms || {};
            const fr = d.first_response_ms;
            const stt = d.stt_after_speech_end_ms;
            latencyBar.textContent = fr != null
                ? `Latency · first audio ${Math.round(fr)}ms · STT ${stt != null ? Math.round(stt) : '—'}ms`
                : 'Latency: measuring…';
        }

        function renderStoredTranscript(transcript) {
            if (!transcript) return;
            transcript.split('\n').forEach((line) => {
                const t = line.trim();
                if (!t) return;
                if (t.startsWith('user:')) addMessage('user', t.slice(5).trim());
                else if (t.startsWith('assistant:')) addMessage('bot', t.slice(10).trim());
            });
        }

        async function preloadResumeSession(id) {
            const res = await fetch(`/api/v1/sessions/${id}`);
            const data = await res.json();
            if (!data.found || !data.session) return;
            messagesEl.innerHTML = '';
            renderStoredTranscript(data.session.transcript || '');
        }

        const taskNodes = new Map();
        function renderTask(event) {
            if (!event || !event.event) return;
            const ok = ['TASK_PROPOSED','TASK_CONFIRMED','TASK_RUNNING','TASK_PROGRESS','TASK_COMPLETED','SUMMARY_UPDATED'];
            if (!ok.includes(event.event)) return;
            const nodeId = event.node_id;
            let div = nodeId ? taskNodes.get(nodeId) : null;
            if (!div) {
                div = document.createElement('div');
                if (nodeId) taskNodes.set(nodeId, div);
                tasksEl.prepend(div);
            }
            const status = event.status || event.phase || event.event;
            div.className = 'task-item ' + (status === 'PROPOSED' ? 'task-proposed' : status === 'RUNNING' ? 'task-running' : status === 'SUCCESS' ? 'task-success' : '');
            div.textContent = `[${event.event}] ${event.feature_name || event.title || nodeId || 'Task'} · ${status}`;
        }

        async function postTaskAction(action, nodeIds, confirmAll = false) {
            if (!sessionId) return;
            const path = action === 'confirm'
                ? `/api/v1/sessions/${sessionId}/tasks/confirm`
                : `/api/v1/sessions/${sessionId}/tasks/cancel`;
            const body = action === 'confirm' ? { node_ids: nodeIds, confirm_all: confirmAll } : { node_ids: nodeIds };
            await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        }
        async function confirmAllTasks() { await postTaskAction('confirm', [], true); }

        function connectStatusSocket() {
            const url = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws/status';
            statusWs = new WebSocket(url);
            statusWs.onmessage = (e) => { try { renderTask(JSON.parse(e.data)); } catch (_) {} };
        }
        function disconnectStatusSocket() {
            if (statusWs) statusWs.close();
            statusWs = null;
            tasksEl.innerHTML = '';
            taskNodes.clear();
            sessionId = null;
        }

        function stopDownlinkPlayback() { playbackNextTime = 0; }
        function playDownlinkPCM(buf) {
            if (!audioContext || !buf || buf.byteLength < 2) return;
            const int16 = new Int16Array(buf);
            const f32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
            const buffer = audioContext.createBuffer(1, f32.length, TARGET_SAMPLE_RATE);
            buffer.getChannelData(0).set(f32);
            const src = audioContext.createBufferSource();
            src.buffer = buffer;
            src.connect(audioContext.destination);
            const now = audioContext.currentTime;
            const startAt = Math.max(now + 0.02, playbackNextTime);
            src.start(startAt);
            playbackNextTime = startAt + buffer.duration;
        }

        function floatTo16kPCM(input, rate) {
            let samples = input;
            if (rate !== TARGET_SAMPLE_RATE) {
                const ratio = rate / TARGET_SAMPLE_RATE;
                const outLen = Math.floor(input.length / ratio);
                const out = new Float32Array(outLen);
                for (let i = 0; i < outLen; i++) {
                    const pos = i * ratio, idx = Math.floor(pos), frac = pos - idx;
                    out[i] = (input[idx] || 0) + ((input[idx + 1] || 0) - (input[idx] || 0)) * frac;
                }
                samples = out;
            }
            const int16 = new Int16Array(samples.length);
            for (let i = 0; i < samples.length; i++) int16[i] = Math.max(-32768, Math.min(32767, samples[i] * 32767));
            return int16.buffer;
        }

        function getUserMediaFn() {
            if (navigator.mediaDevices?.getUserMedia) return (c) => navigator.mediaDevices.getUserMedia(c);
            return null;
        }

        async function requestMicrophone() {
            updateStatus('connecting', 'Allow microphone…');
            const g = getUserMediaFn();
            if (!g) throw new Error('Microphone not supported');
            mediaStream = await g({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
        }

        function startAudioPipeline() {
            audioContext = audioContext || new AudioContext();
            const source = audioContext.createMediaStreamSource(mediaStream);
            audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
            const silent = audioContext.createGain();
            silent.gain.value = 0;
            source.connect(audioProcessor);
            audioProcessor.connect(silent);
            silent.connect(audioContext.destination);
            const rate = audioContext.sampleRate;
            audioProcessor.onaudioprocess = (e) => {
                if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
                ws.send(floatTo16kPCM(e.inputBuffer.getChannelData(0), rate));
            };
        }

        function connectWebSocket() {
            let wsUrl = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws';
            const resumeId = sessionSelect.value;
            if (resumeId) wsUrl += `?resume_session_id=${encodeURIComponent(resumeId)}`;
            ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';
            ws.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    playDownlinkPCM(event.data);
                    return;
                }
                const data = JSON.parse(event.data);
                if (data.type === 'session') {
                    sessionId = data.session_id;
                    updateStatus('connected', data.resumed ? 'Resumed' : 'In call');
                } else if (data.type === 'transcription') {
                    if (data.interim) addMessage('user', data.text, { interim: true });
                    else {
                        stopDownlinkPlayback();
                        addMessage('user', data.text);
                    }
                } else if (data.type === 'assistant') {
                    addMessage('bot', data.text);
                } else if (data.type === 'interrupt') {
                    stopDownlinkPlayback();
                } else if (data.type === 'latency') {
                    showLatency(data);
                }
            };
            return new Promise((resolve, reject) => {
                ws.onerror = () => reject(new Error('WebSocket failed'));
                ws.onopen = () => resolve();
            });
        }

        async function startSession() {
            startBtn.disabled = true;
            try {
                await requestMicrophone();
                if (sessionSelect.value) {
                    await preloadResumeSession(sessionSelect.value);
                }
                connectStatusSocket();
                await connectWebSocket();
                startAudioPipeline();
                if (audioContext?.state === 'suspended') await audioContext.resume();
                isRecording = true;
                stopBtn.disabled = false;
                sessionSelect.disabled = true;
                updateStatus('connected', 'In call — speak anytime');
            } catch (e) {
                alert('Start failed: ' + (e.message || e));
                updateStatus('disconnected', 'Failed');
                stopSession();
            }
        }

        function stopSession() {
            isRecording = false;
            sessionSelect.disabled = false;
            loadSessionOptions();
            disconnectStatusSocket();
            stopDownlinkPlayback();
            audioProcessor?.disconnect();
            audioProcessor = null;
            mediaStream?.getTracks().forEach((t) => t.stop());
            mediaStream = null;
            audioContext?.close();
            audioContext = null;
            ws?.close();
            ws = null;
            interimEl = null;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            updateStatus('disconnected', 'Disconnected');
        }
    </script>
</body>
</html>
